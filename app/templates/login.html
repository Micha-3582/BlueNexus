<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden · {{ app_display_name }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <meta name="theme-color" content="#1b1f24">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ app_display_name }}">
  <style>
    :root {
      --bg: #121519; --card: #1b1f24; --card2: #252a30;
      --fg: #f2f3f5; --muted: #a3a9b0; --accent: #005fbe; --accent-t: #4b9be6; --brand: #f48c24; --border: #363c44;
      --red: #e5544a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--fg);
      background: radial-gradient(1000px 500px at 10% -10%, rgba(60,162,203,.14), transparent 62%), radial-gradient(800px 460px at 100% 110%, rgba(244,140,36,.10), transparent 60%), var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 28px 26px; width: 100%; max-width: 360px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .brand .sun { font-size: 26px; }
    .brand h1 { font-size: 18px; margin: 0; font-weight: 600; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 15px; }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 42px; }
    .pw-toggle { position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      background: none; border: none; margin: 0; width: 34px; height: 34px; padding: 0;
      display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; }
    .pw-toggle:hover { color: var(--fg); }
    .pw-toggle svg { width: 20px; height: 20px; }
    .check { display: flex; align-items: center; gap: 8px; margin: 14px 0 4px; font-size: 13px; color: var(--muted); }
    .check input { width: auto; }
    button { width: 100%; margin-top: 18px; cursor: pointer; border: none; border-radius: 10px;
      padding: 12px 16px; font-size: 15px; font-weight: 600; background: linear-gradient(180deg, #0a6fd3, #005fbe); color: #fff; box-shadow: 0 2px 10px rgba(0,95,190,.3); }
    .error { background: rgba(229,84,74,.12); border: 1px solid rgba(229,84,74,.3);
      color: var(--red); padding: 10px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 4px; }
    input[type=checkbox] { accent-color: var(--accent); }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(60,162,203,.35); }
    .card { box-shadow: 0 10px 34px rgba(0,0,0,.35); }
  </style>
</head>
<body>
  {% if sandbox %}<div style="position:fixed;top:0;left:0;right:0;z-index:3100;background:#7c3aed;color:#fff;padding:8px 14px;font-size:14px;text-align:center">🧪 <b>TESTMODUS</b> – diese App darf nichts nach außen senden: kein Schalten, keine Nachrichten, kein Zugriff auf Cerbo, Geräte oder Kameras.</div>{% endif %}
  <form class="card" method="post" autocomplete="on">
    <div class="brand">
      <img class="sun" src="{{ url_for('static', filename='icon-192.png') }}" alt="" width="28" height="28" style="border-radius:7px;flex:none">
      <h1>{{ app_display_name }}</h1>
    </div>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <label>Benutzername</label>
    <input type="text" name="username" autocomplete="username"
           autocapitalize="off" spellcheck="false" required autofocus>

    <label>Passwort</label>
    <div class="pw-wrap">
      <input type="password" id="pw" name="password" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Passwort anzeigen" title="Passwort anzeigen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <label class="check">
      <input type="checkbox" name="remember" value="1" checked>
      <span>Angemeldet bleiben</span>
    </label>

    <button type="submit">Anmelden</button>
  </form>
  <script>
    document.getElementById('pw-toggle').addEventListener('click', function () {
      var pw = document.getElementById('pw');
      var showing = pw.type === 'text';
      pw.type = showing ? 'password' : 'text';
      this.setAttribute('aria-label', showing ? 'Passwort anzeigen' : 'Passwort verbergen');
      this.title = showing ? 'Passwort anzeigen' : 'Passwort verbergen';
    });
  </script>
  <script src="{{ url_for('static', filename='pwa.js') }}"></script>
</body>
</html>
