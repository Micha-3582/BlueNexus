<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ title }}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <meta name="theme-color" content="#1b1f24">
  {% if og %}<meta name="description" content="{{ og.text }}">
  <meta property="og:type" content="website"><meta property="og:site_name" content="{{ app_display_name }}">
  <meta property="og:title" content="{{ og.title }}"><meta property="og:description" content="{{ og.text }}">
  <meta property="og:image" content="{{ og.image }}"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">{% endif %}
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <style>
    :root { --bg: #121519; --card: #1b1f24; --fg: #f2f3f5; --muted: #a3a9b0; --border: #363c44; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      background: radial-gradient(900px 500px at 10% -10%, rgba(60,162,203,.16), transparent 62%), radial-gradient(800px 460px at 100% 110%, rgba(244,140,36,.10), transparent 60%), var(--bg); }
    .card { max-width: 380px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 34px 26px; box-shadow: 0 10px 34px rgba(0,0,0,.35); }
    .sym { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 700; }
    .ok .sym { background: rgba(60,162,203,.16); color: #4b9be6; box-shadow: 0 0 24px rgba(60,162,203,.35); }
    .no .sym { background: rgba(229,84,74,.14); color: #e5544a; }
    button { width: 100%; padding: 13px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(180deg, #0a6fd3, #005fbe); cursor: pointer; }
    h1 { font-size: 22px; margin: 0 0 8px; } p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <div class="card {{ 'ok' if ok else 'no' }}">
    <div class="sym">{{ '✓' if ok else '✕' }}</div>
    <h1>{{ title }}</h1>
    <p>{{ text }}</p>
    
    {% if confirm %}<form method="post" id="reg" style="margin-top:22px"><button type="submit">Jetzt registrieren</button></form>{% endif %}
  </div>
  <script>
    // Ergebnis ohne Seitenwechsel anzeigen: Nach einem Seitenwechsel darf der Browser das Fenster nicht mehr selbst schliessen, und "zurueck" fuehrte auf
    // die Bestaetigungsseite mit dem schon benutzten (ungueltigen) Link. Deshalb: Bestaetigen per fetch, Ergebnis in derselben Karte, nach 3 s schliessen.
    var card = document.querySelector('.card');
    function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function closeWin() { try { window.close(); } catch (e) {} }
    function showDone(ok, title, text, closeAfter) {
      card.className = 'card ' + (ok ? 'ok' : 'no');
      card.innerHTML = '<div class="sym">' + (ok ? '✓' : '✕') + '</div><h1>' + esc(title) + '</h1><p id="msg">' + esc(text) + '</p>' +
        '<button id="zu" type="button" style="display:none;margin-top:20px;background:#252a30;color:#f2f3f5;border:1px solid #363c44">Schließen</button>';
      if (ok) setTimeout(closeWin, closeAfter);
      setTimeout(function () { var b = document.getElementById('zu'); if (b && !document.hidden) { b.style.display = 'block'; b.onclick = closeWin; document.getElementById('msg').textContent += ' – du kannst dieses Fenster jetzt schließen.'; } }, closeAfter + 800);
    }
    {% if ok and not confirm %}showDone(true, {{ title | tojson }}, {{ text | tojson }}, 1500);{% endif %}
    {% if confirm %}
    document.getElementById('reg').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = e.target.querySelector('button'); btn.disabled = true;
      fetch(location.href, { method: 'POST', headers: { 'Accept': 'application/json' }, credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (j) { showDone(!!j.ok, j.title, j.text, 3000); })
        .catch(function () { e.target.submit(); });                                // Notfall: klassisches Senden
    });
    {% endif %}
  </script>
</body>
</html>
